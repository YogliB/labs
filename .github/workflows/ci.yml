name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node: [20]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}

            - name: Install dependencies
              run: npm ci --ignore-scripts --workspace=git-gaiden --registry=https://registry.npmjs.org/

            - name: Run tests with coverage
              run: cd packages/git-gaiden && npm run test:coverage

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v4
              with:
                  directory: ./packages/git-gaiden/coverage/
                  flags: git-gaiden
                  name: git-gaiden-coverage

            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report-${{ matrix.node }}
                  path: packages/git-gaiden/coverage/html/
